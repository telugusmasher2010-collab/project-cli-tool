[package]
name = "{{module_name}}"
version = "0.1.0"
description = "Tauri v2 desktop app with local LLM integration"
authors = ["{{author}}"]
edition = "2021"

[lib]
name = "{{module_name}}_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
